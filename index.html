<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>رحلة آمنة — مسار الذهاب والعودة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg: #FFF7F3;
    --card: #FFFFFF;
    --rose: #D8607E;
    --rose-deep: #B8425F;
    --ink: #3A2432;
    --muted: #9C7C88;
    --line: #F1DFE1;
    --sage: #6FA287;
    --sage-bg: #E9F3EC;
    --gold: #E3A857;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: linear-gradient(180deg, #FFEFE6 0%, var(--bg) 220px, var(--bg) 100%);
    color: var(--ink);
    font-family: 'Tajawal', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap{ max-width: 480px; margin: 0 auto; padding: 28px 18px 60px; }

  header{ margin-bottom: 16px; }
  .eyebrow{ font-size: 13px; color: var(--rose-deep); font-weight:700; }
  h1{
    font-family:'Markazi Text', serif;
    font-weight:700;
    font-size: 34px;
    line-height:1.2;
    margin: 4px 0 6px;
  }
  .sub{ color: var(--muted); font-size: 14.5px; }

  .mode-tabs{
    display:flex; gap:8px; margin: 16px 0 20px;
    background: var(--line); padding:4px; border-radius:13px;
  }
  .mode-tab{
    flex:1; border:none; background:transparent; padding:10px 8px;
    border-radius:10px; font-family:'Tajawal', sans-serif; font-weight:700;
    font-size:14px; color: var(--rose-deep); cursor:pointer;
  }
  .mode-tab.active{ background:#fff; box-shadow: 0 2px 6px rgba(0,0,0,.08); }

  .progress-row{
    display:flex; align-items:center; gap:12px;
    margin: 18px 0 24px;
  }
  .ring{ position:relative; width:56px; height:56px; flex-shrink:0; }
  .ring svg{ transform: scaleX(-1) rotate(-90deg); }
  .ring-track{ fill:none; stroke:var(--line); stroke-width:5; }
  .ring-fill{ fill:none; stroke:var(--rose); stroke-width:5; stroke-linecap:round; transition: stroke-dasharray .4s ease; }
  .ring-label{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700; color:var(--rose-deep);
  }
  .progress-text{ font-size:14px; color:var(--muted); line-height:1.5; }
  .progress-text b{ color:var(--ink); }

  .current-card{
    background: linear-gradient(135deg, var(--rose) 0%, var(--rose-deep) 100%);
    color: #fff;
    border-radius: 20px;
    padding: 22px 20px;
    box-shadow: 0 10px 26px -10px rgba(184,66,95,.55);
    margin-bottom: 18px;
  }
  .current-card .label{ font-size:12.5px; opacity:.85; font-weight:700; }
  .current-card .name{ font-family:'Markazi Text', serif; font-size:29px; font-weight:700; margin: 4px 0 2px; }
  .current-card .meta{ font-size:13.5px; opacity:.9; direction:ltr; unicode-bidi:embed; text-align:right; }
  .navigate-btn{
    display:inline-flex; align-items:center; gap:7px;
    margin-top:14px; background: rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.35);
    color:#fff; text-decoration:none; font-weight:700; font-size:14.5px;
    padding:9px 15px; border-radius:11px;
  }
  .navigate-btn:active{ background: rgba(255,255,255,.28); }
  .done-btn{
    width:100%; margin-top:10px; background:#fff; color:var(--rose-deep);
    border:none; font-weight:800; font-size:15.5px; padding:12px; border-radius:11px;
    cursor:pointer; font-family:'Tajawal', sans-serif;
  }
  .done-btn:active{ transform: scale(.99); }
  .absent-btn{
    width:100%; margin-top:8px; background: rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.4); color:#fff;
    font-weight:700; font-size:14px; padding:10px; border-radius:11px;
    cursor:pointer; font-family:'Tajawal', sans-serif;
  }
  .absent-btn:active{ background: rgba(255,255,255,.24); }
  .summary-btn{
    width:100%; margin-top:10px; background: rgba(255,255,255,.55);
    border:1px solid #CFE6D8; color:#3E6B54;
    font-weight:800; font-size:14.5px; padding:11px; border-radius:11px;
    cursor:pointer; font-family:'Tajawal', sans-serif;
  }
  .summary-btn:active{ background: rgba(255,255,255,.8); }
  .undo-link{
    display:block; text-align:center; margin-top:10px; background:none; border:none;
    color:var(--rose-deep); font-size:13px; font-weight:700; cursor:pointer;
    text-decoration:underline; font-family:'Tajawal', sans-serif;
  }

  .all-done{
    background: var(--sage-bg); border-radius:20px; padding:26px 20px; text-align:center;
    margin-bottom:18px;
  }
  .all-done .name{ font-family:'Markazi Text', serif; font-size:25px; font-weight:700; color:#3E6B54; margin-bottom:4px;}
  .all-done .meta{ color:#5C8A72; font-size:14px; }

  #map{ height:280px; border-radius:16px; margin-bottom:16px; border:1px solid var(--line); }

  .gmaps-links{ display:flex; gap:8px; margin-bottom:22px; flex-wrap:wrap; }
  .gmaps-btn{
    flex:1; min-width:150px; text-align:center;
    background:#fff; border:1px solid var(--line); color:var(--rose-deep);
    font-weight:700; font-size:13.5px; padding:11px 10px; border-radius:12px;
    text-decoration:none; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .gmaps-btn:active{ background: var(--bg); }

  .copy-banner{
    display:none; background: var(--sage-bg); border:1px solid #CFE6D8;
    border-radius:16px; padding:16px; margin-bottom:18px;
  }
  .copy-banner.show{ display:block; }
  .copy-label{ font-size:12.5px; font-weight:700; color:#3E6B54; margin-bottom:8px; }
  .copy-text{
    background:#fff; border-radius:10px; padding:11px 12px; font-size:14.5px;
    color:var(--ink); line-height:1.5; margin-bottom:10px; word-break:break-word;
  }
  .copy-btn{
    width:100%; background: var(--sage); color:#fff; border:none;
    font-weight:800; font-size:14.5px; padding:11px; border-radius:11px;
    cursor:pointer; font-family:'Tajawal', sans-serif;
  }
  .copy-btn:active{ transform: scale(.99); }

  .section-title{
    font-size:13.5px; font-weight:700; color:var(--muted);
    margin: 4px 0 10px;
  }
  ul.stops{ list-style:none; margin:0; padding:0; }
  ul.stops li{
    display:flex; align-items:center; gap:12px;
    background: var(--card); border:1px solid var(--line);
    border-radius:14px; padding:12px 14px; margin-bottom:9px;
  }
  ul.stops li.done{ opacity:.55; }
  .idx{
    width:26px; height:26px; border-radius:50%; flex-shrink:0;
    background: var(--line); color:var(--rose-deep); font-weight:700; font-size:12.5px;
    display:flex; align-items:center; justify-content:center;
  }
  li.done .idx{ background: var(--sage); color:#fff; }
  ul.stops li.absent{ opacity:.65; background: #FBF8F6; }
  li.absent .idx{ background:#C9BEC3; color:#fff; }
  .stop-name{ font-weight:700; font-size:15px; }
  .absent-tag{ color:#9C7C88; font-size:11.5px; font-weight:700; }
  .stop-coord{ color:var(--muted); font-size:12px; margin-top:1px; direction:ltr; unicode-bidi:embed; text-align:right; }
  .row-actions{ margin-inline-start:auto; display:flex; gap:8px; }
  .check, .mark-absent{
    width:38px; height:38px; border-radius:10px;
    border:2px solid var(--line); flex-shrink:0; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:16px;
  }
  li.done .check{ background:var(--sage); border-color:var(--sage); color:#fff; }
  li.absent .mark-absent{ background:#9C7C88; border-color:#9C7C88; color:#fff; }

  .absent-section{ margin-top:8px; }
  .undo-absent-btn{
    margin-inline-start:auto; background:none; border:1px solid var(--line);
    color:var(--rose-deep); font-size:12px; font-weight:700; padding:6px 10px;
    border-radius:9px; cursor:pointer; font-family:'Tajawal', sans-serif;
  }

  footer{ text-align:center; color:var(--muted); font-size:12.5px; margin-top:26px; }
  .reset{
    display:block; margin: 14px auto 0; background:none; border:none;
    color:var(--rose-deep); font-size:13.5px; font-weight:700; cursor:pointer;
    text-decoration:underline; font-family:'Tajawal', sans-serif;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow" id="eyebrow">رحلة آمنة · الذهاب</div>
    <h1 id="page-title">مسار الذهاب</h1>
    <div class="sub" id="page-sub">١٤ منزلًا، مرتّبة حسب أفضل مسار إلى المدرسة</div>
  </header>

  <div class="mode-tabs">
    <button class="mode-tab active" id="tab-morning" data-mode="morning">الذهاب</button>
    <button class="mode-tab" id="tab-afternoon" data-mode="afternoon">العودة</button>
  </div>

  <div class="progress-row">
    <div class="ring">
      <svg width="56" height="56" viewBox="0 0 56 56">
        <circle class="ring-track" cx="28" cy="28" r="24"></circle>
        <circle class="ring-fill" id="ring-fill" cx="28" cy="28" r="24" stroke-dasharray="0 151"></circle>
      </svg>
      <div class="ring-label" id="ring-label">0/14</div>
    </div>
    <div class="progress-text" id="progress-text"></div>
  </div>

  <div id="current-slot"></div>

  <div class="copy-banner" id="copy-banner"></div>

  <div id="map"></div>

  <div class="gmaps-links" id="gmaps-links"></div>

  <div class="section-title" id="route-section-title">ترتيب الرحلة الحالي</div>
  <ul class="stops" id="stops-list"></ul>

  <div class="absent-section" id="absent-section"></div>

  <button class="reset" id="reset-btn">إعادة تعيين تقدّم هذه الرحلة</button>
  <footer id="page-footer">العامرات · مسار الذهاب — ١٤ محطة</footer>
</div>

<script>
const HOME   = { name: "نقطة الانطلاق", lat: 23.469158, lng: 58.475975 };
const SCHOOL = { name: "المدرسة", lat: 23.534421, lng: 58.456905 };

// إحداثيات المنازل الخام، مع اسم الطالب واسم مرجعي ثابت (id) لا يتغيّر
// أبدًا — حتى عند إعادة ترتيب المسار أو استبعاد أحد المنازل بسبب الغياب.
const RAW_STOPS = [
  { lat: 23.477276, lng: 58.474827, studentName: "مشعل" },
  { lat: 23.479507, lng: 58.476406, studentName: "عبدالرحمن" },
  { lat: 23.479063, lng: 58.472530, studentName: "ألين" },
  { lat: 23.481443, lng: 58.471748, studentName: "فارس" },
  { lat: 23.481047, lng: 58.469006, studentName: "خالد" },
  { lat: 23.483963, lng: 58.474094, studentName: "امال" },
  { lat: 23.487284, lng: 58.470703, studentName: "ديمة" },
  { lat: 23.489319, lng: 58.476501, studentName: "طناف" },
  { lat: 23.491389, lng: 58.477056, studentName: "جمان" },
  { lat: 23.491694, lng: 58.477667, studentName: "ملاك" },
  { lat: 23.491472, lng: 58.477889, studentName: "حور" },
  { lat: 23.492870, lng: 58.478542, studentName: "ورد" },
  { lat: 23.490744, lng: 58.481663, studentName: "علي" },
  { lat: 23.492619, lng: 58.483624, studentName: "ريان" },
].map((s, i) => ({ ...s, id: "p" + i }));

const MODES = {
  morning: {
    start: HOME, end: SCHOOL,
    eyebrow: "رحلة آمنة · الذهاب",
    title: "مسار الذهاب",
    sub: "منازل مرتّبة حسب أفضل مسار إلى المدرسة",
    footer: "العامرات · مسار الذهاب",
    nextLabel: "المنزل التالي",
    doneBtn: "تم الاستلام",
    noneYetText: "لم يتم استلام أي طالب بعد — توجّهي إلى أول منزل.",
    progressVerb: "تم استلام",
    allDoneTitle: "الجميع في الحافلة",
    endBtnLabel: "التوجه إلى المدرسة",
    msgVerb: "تم استلام",
    allDoneMsg: n => `🌅 اكتمل استلام جميع الطلاب (${n}/${n}) — التوجه الآن إلى المدرسة`,
  },
  afternoon: {
    start: SCHOOL, end: HOME,
    eyebrow: "رحلة آمنة · العودة",
    title: "مسار العودة",
    sub: "منازل مرتّبة بالاتجاه المعاكس بعد نهاية اليوم الدراسي",
    footer: "العامرات · مسار العودة",
    nextLabel: "المنزل التالي",
    doneBtn: "تم التوصيل",
    noneYetText: "لم يتم توصيل أي طالب بعد — انطلقي من المدرسة.",
    progressVerb: "تم توصيل",
    allDoneTitle: "انتهت الرحلة",
    endBtnLabel: "التوجه إلى نقطة الانطلاق",
    msgVerb: "تم توصيل",
    allDoneMsg: n => `🏠 تم توصيل جميع الطلاب (${n}/${n}) — انتهت الرحلة`,
  },
};

let currentModeKey = "morning";
let STOPS = [];              // المحطات النشطة فقط (غير الغائبة)، بترتيب القيادة الفعلي
let status = new Map();      // id -> 'done' | 'absent'
let actionHistory = [];      // مكدّس آخر الإجراءات (بمعرّفات id) للتراجع

// الترتيب اليدوي الثابت للرحلة — لا يُعاد حسابه تلقائيًا، فقط يُستبعد منه
// الطلاب الغائبون مع الحفاظ على نفس تسلسل البقية.
const FIXED_ORDER = [
  "عبدالرحمن", "مشعل", "ألين", "خالد", "فارس", "ديمة", "امال",
  "طناف", "جمان", "ملاك", "حور", "ورد", "علي", "ريان",
];
const FIXED_STOPS = FIXED_ORDER.map(name => RAW_STOPS.find(s => s.studentName === name));

function mode(){ return MODES[currentModeKey]; }
function statusValue(id){ const e = status.get(id); return e ? e.v : undefined; }
function statusTime(id){ const e = status.get(id); return e ? e.t : null; }
function isAbsent(id){ return statusValue(id) === 'absent'; }
function activeFixedStops(){ return FIXED_STOPS.filter(s => !isAbsent(s.id)); }

function todayKey(){
  return "route-progress:" + currentModeKey + ":" + new Date().toISOString().slice(0,10);
}
function tripStartKey(){
  return "trip-start:" + currentModeKey + ":" + new Date().toISOString().slice(0,10);
}
let tripStartTime = null; // Date وقت أول إجراء اليوم في هذه الرحلة، لحساب مدة الرحلة في الملخص
function loadTripStart(){
  try{
    const raw = localStorage.getItem(tripStartKey());
    tripStartTime = raw ? new Date(raw) : null;
  }catch(e){ tripStartTime = null; }
}
function markTripStartIfNeeded(){
  if(tripStartTime) return;
  tripStartTime = new Date();
  try{ localStorage.setItem(tripStartKey(), tripStartTime.toISOString()); }catch(e){}
}
function clearTripStart(){
  try{ localStorage.removeItem(tripStartKey()); }catch(e){}
}

function loadProgress(){
  status = new Map();
  actionHistory = [];
  try{
    const raw = localStorage.getItem(todayKey());
    if(raw){ status = new Map(Object.entries(JSON.parse(raw))); }
  }catch(e){ /* لا يوجد تقدم محفوظ بعد، أو التخزين غير متاح */ }
  loadTripStart();
}
function saveProgress(){
  try{
    localStorage.setItem(todayKey(), JSON.stringify(Object.fromEntries(status)));
  }catch(e){
    console.warn("لن يتم حفظ التقدم بعد إعادة تحميل الصفحة (التخزين غير متاح).");
  }
}
function setStatus(id, value){
  markTripStartIfNeeded();
  status.set(id, { v: value, t: new Date().toISOString() });
  actionHistory.push(id);
  saveProgress();
}

function navUrl(lat, lng){
  return "https://www.google.com/maps/dir/?api=1&destination=" + lat + "," + lng + "&travelmode=driving";
}

function buildLegs(points){
  const maxPerLeg = 10;
  const legs = [];
  let start = 0;
  while(start < points.length - 1){
    const end = Math.min(start + maxPerLeg - 1, points.length - 1);
    legs.push(points.slice(start, end + 1));
    start = end;
  }
  return legs;
}
function legUrl(leg){
  const origin = leg[0];
  const destination = leg[leg.length - 1];
  const mids = leg.slice(1, -1);
  let url = `https://www.google.com/maps/dir/?api=1&origin=${origin.lat},${origin.lng}&destination=${destination.lat},${destination.lng}&travelmode=driving`;
  if(mids.length) url += `&waypoints=${mids.map(p => p.lat + "," + p.lng).join("|")}`;
  return url;
}
function renderGoogleMapsLinks(){
  const points = [mode().start, ...STOPS, mode().end];
  const legs = buildLegs(points);
  const container = document.getElementById('gmaps-links');
  container.innerHTML = legs.map((leg, i) => {
    const label = legs.length > 1 ? `خرائط Google — الجزء ${i + 1}` : "فتح المسار كاملًا في خرائط Google";
    return `<a class="gmaps-btn" href="${legUrl(leg)}" target="_blank" rel="noopener">${label}</a>`;
  }).join('');
}

function formatDuration(seconds){
  const mins = Math.round(seconds / 60);
  if(mins <= 0) return "أقل من دقيقة";
  if(mins === 1) return "دقيقة واحدة";
  if(mins === 2) return "دقيقتين";
  if(mins <= 10) return `${mins} دقائق`;
  return `${mins} دقيقة`;
}
// مجموع مدد الأرجل (legs) بين محطتين في المسار الحالي، باستخدام بيانات
// المدة الفعلية القادمة من OSRM. يعيد null إن لم تتوفر البيانات بعد.
function travelSeconds(fromIdx, toIdx){
  if(!ROUTE_LEGS) return null;
  let total = 0;
  for(let k = fromIdx + 1; k <= toIdx; k++){
    if(ROUTE_LEGS[k] === undefined) return null;
    total += ROUTE_LEGS[k];
  }
  return total;
}

function messageFor(doneStop){
  const time = new Date().toLocaleTimeString('ar-OM', { hour:'2-digit', minute:'2-digit' });
  let msg = `✅ ${mode().msgVerb} ${doneStop.name} — الساعة ${time}`;

  const doneIdx = STOPS.findIndex(s => s.id === doneStop.id);
  const nextPending = STOPS.slice(doneIdx + 1).find(s => statusValue(s.id) !== 'done');
  if(nextPending){
    const nextIdx = STOPS.findIndex(s => s.id === nextPending.id);
    const secs = travelSeconds(doneIdx, nextIdx);
    msg += secs !== null
      ? `\n🚌 التالي: ${nextPending.name} — خلال ${formatDuration(secs)} تقريبًا`
      : `\n🚌 التالي: ${nextPending.name}`;
  }
  return msg;
}
function allDoneMessage(){
  const time = new Date().toLocaleTimeString('ar-OM', { hour:'2-digit', minute:'2-digit' });
  return mode().allDoneMsg(STOPS.length) + ` — الساعة ${time}`;
}
function daySummaryMessage(){
  const time = new Date().toLocaleTimeString('ar-OM', { hour:'2-digit', minute:'2-digit' });
  const doneNames = STOPS.filter(s => statusValue(s.id) === 'done').map(s => s.name);
  const absentNames = RAW_STOPS.filter(s => isAbsent(s.id)).map(s => s.studentName);

  let msg = `📋 ملخص ${mode().title} — الساعة ${time}\n${mode().progressVerb}: ${doneNames.length} طالب`;
  if(absentNames.length){
    msg += `\n🚫 غياب (${absentNames.length}): ${absentNames.join('، ')}`;
  }
  if(tripStartTime){
    const elapsedSecs = Math.round((Date.now() - tripStartTime.getTime()) / 1000);
    msg += `\n⏱️ مدة الرحلة: ${formatDuration(elapsedSecs)}`;
  }
  return msg;
}

// ملخص نصي مصمَّم بعناية (بلا خريطة) — بطاقة إحصاءات علوية، ثم جدول
// مرتّب بأسماء الطلاب وأوقاتهم، ثم قسم غياب اليوم إن وُجد.
function buildDayPdfContent(){
  const m = mode();
  const absentPts = RAW_STOPS.filter(s => isAbsent(s.id));
  const doneCount = STOPS.filter(s => statusValue(s.id) === 'done').length;
  const timeFmt = iso => iso ? new Date(iso).toLocaleTimeString('ar-OM', { hour:'2-digit', minute:'2-digit' }) : '—';
  const dateStr = new Date().toLocaleDateString('ar-OM', { year:'numeric', month:'long', day:'numeric' });
  const nowStr = new Date().toLocaleTimeString('ar-OM', { hour:'2-digit', minute:'2-digit' });

  let durationStr = '—';
  if(tripStartTime){

async function generateDayPdf(){
  const btn = document.getElementById('pdf-btn');
  if(btn){ btn.disabled = true; btn.textContent = "جارٍ التجهيز..."; }

  const container = document.createElement('div');
  container.style.position = 'fixed';
  container.style.left = '-9999px';
  container.style.top = '0';
  container.innerHTML = buildDayPdfContent();
  document.body.appendChild(container);

  try{
    await document.fonts.ready; // نضمن تحميل خطوط تجوال/مرقزي قبل الالتقاط
    // نلتقط المحتوى كصورة فقط (بلا طبقة نص) — استخدام jsPDF's .html() مباشرة
    // كان يحاول أيضًا إضافة نص حقيقي بخط lsPDF الافتراضي، وهذا الخط لا يدعم
    // الحروف العربية إطلاقًا فتظهر رموزًا مشوّهة. الصورة تتجنّب هذه المشكلة كليًا.
    const canvas = await html2canvas(container.firstElementChild, { scale: 2, backgroundColor: '#ffffff' });

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit:'pt', format:'a4' });
    const margin = 20;
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const usableWidth = pageWidth - margin*2;
    const usableHeight = pageHeight - margin*2;
    const scaleRatio = usableWidth / canvas.width;
    const totalHeightPt = canvas.height * scaleRatio;

    if(totalHeightPt <= usableHeight){
      pdf.addImage(canvas.toDataURL('image/png'), 'PNG', margin, margin, usableWidth, totalHeightPt);
    } else {
      // المحتوى أطول من صفحة واحدة — نقصّه إلى شرائح ونوزّعها على عدة صفحات
      const sliceHeightPx = Math.floor(usableHeight / scaleRatio);
      let renderedPx = 0;
      let first = true;
      while(renderedPx < canvas.height){
        const thisSliceHeight = Math.min(sliceHeightPx, canvas.height - renderedPx);
        const sliceCanvas = document.createElement('canvas');
        sliceCanvas.width = canvas.width;
        sliceCanvas.height = thisSliceHeight;
        sliceCanvas.getContext('2d').drawImage(
          canvas, 0, renderedPx, canvas.width, thisSliceHeight, 0, 0, canvas.width, thisSliceHeight
        );
        if(!first) pdf.addPage();
        pdf.addImage(sliceCanvas.toDataURL('image/png'), 'PNG', margin, margin, usableWidth, thisSliceHeight * scaleRatio);
        renderedPx += thisSliceHeight;
        first = false;
      }
    }

    pdf.save(`ملخص-${mode().title}-${new Date().toISOString().slice(0,10)}.pdf`);
  }catch(e){
    console.warn("تعذّر إنشاء ملف PDF", e);
    alert("تعذّر إنشاء ملف PDF هذه المرة. يمكنك استخدام زر نسخ الملخص كنص بدلاً من ذلك.");
  }finally{
    document.body.removeChild(container);
    if(btn){ btn.disabled = false; btn.textContent = "تنزيل PDF"; }
  }
}

function showCopyBanner(message){
  const banner = document.getElementById('copy-banner');
  banner.innerHTML = `
    <div class="copy-label">جاهزة للنسخ إلى مجموعة الواتساب</div>
    <div class="copy-text" id="copy-text">${message}</div>
    <button class="copy-btn" id="copy-btn">نسخ الرسالة</button>`;
  banner.classList.add('show');
  document.getElementById('copy-btn').onclick = async () => {
    const btn = document.getElementById('copy-btn');
    try{
      await navigator.clipboard.writeText(message);
    }catch(e){
      const ta = document.createElement('textarea');
      ta.value = message; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); }catch(e2){}
      document.body.removeChild(ta);
    }
    btn.textContent = "تم النسخ";
    setTimeout(() => { if(document.getElementById('copy-btn')) btn.textContent = "نسخ الرسالة"; }, 2000);
  };
}

// تراجع: يعيد آخر إجراء فقط. إن كان الإجراء غيابًا، يعيد حساب المسار
// لأن مجموعة المحطات النشطة تغيّرت.
function undoLast(){
  const id = actionHistory.pop();
  if(id === undefined) return;
  const wasAbsent = statusValue(id) === 'absent';
  status.delete(id);
  saveProgress();
  if(wasAbsent){ optimizeAndDrawRoute(false); } else { render(); }
}

function render(){
  const m = mode();
  const total = RAW_STOPS.length;
  const absentCount = RAW_STOPS.filter(s => isAbsent(s.id)).length;
  const doneCount = STOPS.filter(s => statusValue(s.id) === 'done').length;
  const handledCount = doneCount + absentCount;
  const pct = handledCount / total;
  const circumference = 2 * Math.PI * 24;
  document.getElementById('ring-fill').setAttribute('stroke-dasharray', (circumference*pct).toFixed(1) + " " + circumference.toFixed(1));
  document.getElementById('ring-label').textContent = handledCount + "/" + total;

  document.getElementById('route-section-title').textContent =
    absentCount > 0 ? `ترتيب الرحلة الحالي (${STOPS.length} من ${total})` : "ترتيب الرحلة الحالي";

  const nextStop = STOPS.find(s => statusValue(s.id) !== 'done');
  const progressText = document.getElementById('progress-text');
  const currentSlot = document.getElementById('current-slot');
  const undoBtn = actionHistory.length
    ? `<button class="undo-link" id="undo-btn">تراجع عن آخر إجراء</button>` : '';

  if(nextStop){
    progressText.innerHTML = handledCount === 0
      ? m.noneYetText
      : `<b>${m.progressVerb} ${doneCount} من ${total}</b>` + (absentCount ? ` (وغياب ${absentCount})` : '') + ` حتى الآن.`;
    currentSlot.innerHTML = `
      <div class="current-card">
        <div class="label">${m.nextLabel}</div>
        <div class="name">${nextStop.name}</div>
        <div class="meta">${nextStop.lat.toFixed(6)}, ${nextStop.lng.toFixed(6)}</div>
        <a class="navigate-btn" href="${navUrl(nextStop.lat, nextStop.lng)}" target="_blank" rel="noopener">توجيه</a>
        <button class="done-btn" id="mark-done-btn">${m.doneBtn}</button>
        <button class="absent-btn" id="mark-absent-btn">الطالب غائب اليوم</button>
        ${undoBtn}
      </div>`;
    document.getElementById('mark-done-btn').onclick = () => {
      setStatus(nextStop.id, 'done');
      const isLast = STOPS.every(s => statusValue(s.id) === 'done');
      showCopyBanner(isLast ? allDoneMessage() : messageFor(nextStop));
      render();
    };
    document.getElementById('mark-absent-btn').onclick = () => {
      setStatus(nextStop.id, 'absent');
      document.getElementById('copy-banner').classList.remove('show');
      optimizeAndDrawRoute(false); // المحطات النشطة تغيّرت — أعِد حساب أفضل مسار، دون تغيير تكبير الخريطة
    };
  } else if(STOPS.length === 0){
    currentSlot.innerHTML = `
      <div class="all-done">
        <div class="name">لا يوجد طلاب اليوم</div>
        <div class="meta">جميع المحطات مسجّلة غائبة</div>
      </div>`;
    progressText.innerHTML = `تم تسجيل غياب <b>${absentCount} من ${total}</b>.`;
  } else {
    progressText.innerHTML = `<b>جميع محطات اليوم (${STOPS.length})</b> — تمت معالجتها${absentCount ? ` (وغياب ${absentCount} آخرين)` : ''}.`;
    currentSlot.innerHTML = `
      <div class="all-done">
        <div class="name">${m.allDoneTitle}</div>
        <div class="meta">${m.end.name} — ${m.end.lat.toFixed(6)}, ${m.end.lng.toFixed(6)}</div>
        <a class="navigate-btn" style="background:var(--sage);border-color:var(--sage);margin-top:12px;color:#fff" href="${navUrl(m.end.lat, m.end.lng)}" target="_blank" rel="noopener">${m.endBtnLabel}</a>
        <button class="summary-btn" id="summary-btn">نسخ ملخص اليوم</button>
        <button class="summary-btn" id="pdf-btn" style="margin-top:8px;">تنزيل PDF</button>
        ${undoBtn}
      </div>`;
    document.getElementById('summary-btn').onclick = () => showCopyBanner(daySummaryMessage());
    document.getElementById('pdf-btn').onclick = () => generateDayPdf();
  }
  if(document.getElementById('undo-btn')){
    document.getElementById('undo-btn').onclick = undoLast;
  }

  const list = document.getElementById('stops-list');
  list.innerHTML = STOPS.map((s, i) => {
    const done = statusValue(s.id) === 'done';
    return `<li class="${done ? 'done' : ''}" data-id="${s.id}">
      <div class="idx">${i+1}</div>
      <div>
        <div class="stop-name">${s.name}</div>
        <div class="stop-coord">${s.lat.toFixed(6)}, ${s.lng.toFixed(6)}</div>
      </div>
      <div class="row-actions">
        <div class="check" title="تم الاستلام/التوصيل">${done ? '✓' : ''}</div>
        <div class="mark-absent" title="غائب">✕</div>
      </div>
    </li>`;
  }).join('');

  list.querySelectorAll('li').forEach(li => {
    const id = li.dataset.id;
    li.querySelector('.check').onclick = () => {
      const stop = STOPS.find(s => s.id === id);
      if(statusValue(id) === 'done'){
        status.delete(id); saveProgress();
      } else {
        setStatus(id, 'done');
        const isLast = STOPS.every(s => statusValue(s.id) === 'done');
        showCopyBanner(isLast ? allDoneMessage() : messageFor(stop));
      }
      render();
    };
    li.querySelector('.mark-absent').onclick = () => {
      setStatus(id, 'absent');
      document.getElementById('copy-banner').classList.remove('show');
      optimizeAndDrawRoute(false); // المحطات النشطة تغيّرت — أعِد حساب أفضل مسار، دون تغيير تكبير الخريطة
    };
  });

  const absentStops = RAW_STOPS.filter(s => isAbsent(s.id));
  const absentSection = document.getElementById('absent-section');
  if(absentStops.length === 0){
    absentSection.innerHTML = '';
  } else {
    absentSection.innerHTML = `
      <div class="section-title">غياب اليوم (${absentStops.length}) — مستبعدون من المسار</div>
      <ul class="stops">
        ${absentStops.map(s => `
          <li class="absent" data-id="${s.id}">
            <div class="idx">✕</div>
            <div>
              <div class="stop-name">${s.studentName} <span class="absent-tag">· غائب</span></div>
              <div class="stop-coord">${s.lat.toFixed(6)}, ${s.lng.toFixed(6)}</div>
            </div>
            <button class="undo-absent-btn" data-undo-id="${s.id}">إلغاء الغياب</button>
          </li>`).join('')}
      </ul>`;
    absentSection.querySelectorAll('.undo-absent-btn').forEach(btn => {
      btn.onclick = () => {
        status.delete(btn.dataset.undoId);
        saveProgress();
        optimizeAndDrawRoute(false); // عاد منزل نشط إلى المسار — أعِد حساب أفضل ترتيب، دون تغيير تكبير الخريطة
      };
    });
  }

  drawMarkers();
  renderGoogleMapsLinks();
}

let stopMarkers = [];
let startMarker = null;
let endMarker = null;
function drawMarkers(){
  stopMarkers.forEach(mk => map.removeLayer(mk));

let routeLine = null;
let ROUTE_LEGS = null; // مدد الأرجل بين كل نقطتين متتاليتين في المسار الحالي (بالثواني)، من OSRM

// الترتيب ثابت يدويًا (FIXED_ORDER) ولا يُعاد حسابه — يُستبعد منه الغائبون
// فقط. نستخدم خدمة "Route" من OSRM (وليس "Trip") لرسم المسار الفعلي على
// الطرق بهذا الترتيب تحديدًا، دون اقتراح ترتيب مختلف.
async function optimizeAndDrawRoute(fit = true){
  const m = mode();
  const active = activeFixedStops();

  if(active.length === 0){
    STOPS = [];
    ROUTE_LEGS = null;
    if(routeLine) map.removeLayer(routeLine);
    routeLine = L.polyline([[m.start.lat, m.start.lng], [m.end.lat, m.end.lng]], { color:'#D8607E', weight:3, opacity:.5, dashArray:'1,7' }).addTo(map);
    if(fit) map.fitBounds([[m.start.lat, m.start.lng], [m.end.lat, m.end.lng]], { padding:[18,18] });
    render();
    return;
  }

  // الترتيب معروف فورًا (ثابت)، فلا داعي لانتظار الشبكة لعرض القائمة
  STOPS = active.map(s => ({ ...s, name: s.studentName }));
  ROUTE_LEGS = null; // ستُحدَّث بعد استجابة الشبكة أدناه
  render();

  const points = [m.start, ...active, m.end];
  const coordStr = points.map(p => p.lng + "," + p.lat).join(";");
  const url = `https://router.project-osrm.org/route/v1/driving/${coordStr}?overview=full&geometries=geojson`;
  const activeIdsKey = active.map(s => s.id).join(",");
  const cacheKey = "route-cache:" + currentModeKey;

  // في انتظار الشبكة: استخدمي آخر مسار محفوظ لنفس مجموعة المحطات إن وُجد،
  // بدلًا من خط مستقيم، كي لا يبدو التطبيق معطّلًا عند ضعف الاتصال.
  let usedCache = false;
  try{
    const cachedRaw = localStorage.getItem(cacheKey);
    if(cachedRaw){
      const cached = JSON.parse(cachedRaw);
      if(cached.activeIdsKey === activeIdsKey){
        if(routeLine) map.removeLayer(routeLine);
        routeLine = L.polyline(cached.roadLatLngs, { color:'#D8607E', weight:4, opacity:.85 }).addTo(map);
        if(fit) map.fitBounds(cached.roadLatLngs, { padding:[18,18] });
        ROUTE_LEGS = cached.legs || null;
        usedCache = true;
      }
    }
  }catch(e){ /* لا يوجد مسار محفوظ صالح */ }

  if(!usedCache){
    const fallbackLatLngs = points.map(p => [p.lat, p.lng]);
    if(routeLine) map.removeLayer(routeLine);
    routeLine = L.polyline(fallbackLatLngs, { color:'#D8607E', weight:3, opacity:.5, dashArray:'1,7' }).addTo(map);
    if(fit) map.fitBounds(fallbackLatLngs, { padding:[18,18] });
  }
  render();

  try{
    const res = await fetch(url);
    const data = await res.json();
    if(data.code === "Ok" && data.routes && data.routes[0]){
      const roadLatLngs = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
      map.removeLayer(routeLine);
      routeLine = L.polyline(roadLatLngs, { color:'#D8607E', weight:4, opacity:.85 }).addTo(map);
      if(fit) map.fitBounds(roadLatLngs, { padding:[18,18] });

      // مدة كل رجل بين نقطتين متتاليتين، لاستخدامها في رسائل "التالي خلال..."
      const legs = data.routes[0].legs ? data.routes[0].legs.map(l => l.duration) : null;
      ROUTE_LEGS = legs;
      render(); // لتحديث أي رسالة قيد العرض إن توفّرت المدة الآن

      try{
        localStorage.setItem(cacheKey, JSON.stringify({ activeIdsKey, roadLatLngs, legs }));
      }catch(e){ /* تعذّر الحفظ — لا يؤثر على عمل التطبيق الآن */ }
    }
  }catch(e){
    console.warn(usedCache
      ? "تعذّر تحديث المسار، ما زال يُعرض آخر مسار محفوظ."
      : "تعذّر الوصول لخدمة رسم المسار، سيظهر خط مستقيم بدلًا من مسار الطرق.");
  }
}

function applyModeUI(){

  document.getElementById('eyebrow').textContent = mode().eyebrow;

  document.getElementById('page-sub').textContent = mode().sub;

}

function switchMode(newModeKey){

  currentModeKey = newModeKey;
  applyModeUI();
  document.getElementById('copy-banner').classList.remove('show');

  loadProgress();
  optimizeAndDrawRoute();
}

// عند فتح الصفحة لأول مرة، تُختار رحلة الذهاب أو العودة تلقائيًا حسب
// الوقت الحالي — قبل الساعة ١٢ ظهرًا نفترض الذهاب، وبعدها العودة.
// هذا افتراضي فقط، ويمكن تغييره يدويًا من التبويبين في أي وقت.
const currentHour = new Date().getHours();
currentModeKey = currentHour < 12 ? 'morning' : 'afternoon';
applyModeUI();

loadProgress();
optimizeAndDrawRoute();
